<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bookshelf</title>
<meta name="description" content="A personal bookshelf">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230a0a0a%27/%3E%3Crect x=%279%27 y=%279%27 width=%274%27 height=%2715%27 rx=%27.6%27 fill=%27%23f4f2ed%27/%3E%3Crect x=%2714%27 y=%277.6%27 width=%274%27 height=%2716.4%27 rx=%27.6%27 fill=%27%23ffd400%27/%3E%3Crect x=%2719%27 y=%279%27 width=%274%27 height=%2715%27 rx=%27.6%27 fill=%27%23f4f2ed%27/%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="./shelf.css">
</head>
<body>

<header>
  <a class="brand" href="./" aria-label="Bookshelf home">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
    <span>Bookshelf</span>
  </a>
  <div class="controls">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5.5"/>
        <path d="M12.5 12.5L16.5 16.5"/>
      </svg>
      <input id="search" type="search" placeholder="Search…" aria-label="Search books">
    </div>
    <select id="sort" aria-label="Sort books">
      <option value="title">Title</option>
      <option value="author">Author</option>
      <option value="year">Newest</option>
      <option value="pages">Longest</option>
    </select>
    <button id="sync-btn" hidden aria-label="Copy books to Google Drive">Sync</button>
    <button id="signin-btn" hidden aria-label="Sign in with Google to read books from Drive">Sign in</button>
  </div>
</header>

<div class="page-head">
  <h1 id="shelf-title">All books</h1>
  <p id="stats"></p>
</div>

<section class="shelf-section" aria-label="Book shelf">
  <nav id="tabs" aria-label="Collections"><span class="tab-ind" aria-hidden="true"></span></nav>

  <div id="fit">
    <main id="viewport" tabindex="0" aria-label="Shelf. Arrow keys browse, Enter opens the book in the middle.">
      <div id="probe" aria-hidden="true"></div>
      <div id="tape" aria-hidden="true"></div>
      <div id="empty" hidden>
        <p>Nothing matches.</p>
        <button id="empty-clear" class="btn">Clear</button>
      </div>
    </main>
  </div>

  <div id="shelf-nav">
    <button id="shelf-prev" aria-label="Previous book">
      <svg viewBox="0 0 18 10" aria-hidden="true"><path d="M5 1 L1 5 L5 9 M1 5 H17"/></svg>
    </button>
    <button id="shelf-open" class="sr-only">Open book</button>
    <button id="shelf-next" aria-label="Next book">
      <svg viewBox="0 0 18 10" aria-hidden="true"><path d="M13 1 L17 5 L13 9 M17 5 H1"/></svg>
    </button>
  </div>
  <p id="shelf-live" class="sr-only" aria-live="polite"></p>
</section>

<aside id="detail" aria-hidden="true" inert role="dialog" aria-labelledby="detail-title">
  <div class="dp-top">
    <button id="detail-close" aria-label="Back to shelf">&#8592; Shelf</button>
  </div>
  <div class="dp-grid">
    <div class="dp-text">
      <div class="m"><p id="detail-eyebrow" class="dp-eyebrow"></p></div>
      <div class="m"><h2 id="detail-title"></h2></div>
      <div class="m"><p id="detail-author"></p></div>
      <p id="detail-line" class="dp-line"></p>
      <div class="actions">
        <button id="detail-read" class="btn primary">Read</button>
        <button id="detail-status" class="btn"></button>
        <a id="detail-open" class="btn ghost" href="#">Open file</a>
      </div>
      <p id="detail-progress" class="dp-progress"></p>
      <div id="detail-about"></div>
      <div id="detail-meta"></div>
    </div>
    <div class="dp-cover"><div id="detail-cover" role="img" aria-label="Book cover"></div></div>
  </div>
</aside>

<div id="reader" aria-hidden="true" inert role="dialog" aria-label="Reader">
  <div id="reader-stage">
    <div id="reader-page">
      <div class="rd-sheet">
        <canvas></canvas>
        <div class="rd-inner"><div class="rd-hl"></div><div class="textLayer"></div></div>
      </div>
      <div class="rd-sheet" hidden>
        <canvas></canvas>
        <div class="rd-inner"><div class="rd-hl"></div><div class="textLayer"></div></div>
      </div>
    </div>
    <article id="reader-flow" lang="en"></article>
    <p id="reader-msg" role="status"></p>
    <button id="reader-signin" class="btn primary" hidden>Sign in with Google</button>
  </div>
  <div class="rd-bar rd-top">
    <button id="reader-close" aria-label="Close reader">&#8592;</button>
    <span id="reader-title"></span>
    <button id="reader-aa" aria-expanded="false" aria-controls="rd-display" aria-label="Display settings">Aa</button>
    <button id="reader-panel-btn" aria-expanded="false" aria-controls="reader-panel">Notes</button>
  </div>

  <div id="rd-display" hidden role="dialog" aria-label="Display">
    <div class="seg" role="group" aria-label="View">
      <button id="reader-pagemode" aria-pressed="true">Page</button>
      <button id="reader-textmode" aria-pressed="false">Text</button>
    </div>
    <div class="rd-row rd-for-text">
      <span>Size</span>
      <span class="rd-size">
        <button id="reader-smaller" aria-label="Smaller text">A&#8722;</button>
        <button id="reader-larger" aria-label="Larger text">A+</button>
      </span>
    </div>
    <label class="rd-row rd-for-page"><span>Trim margins</span><button id="reader-crop" role="switch" aria-pressed="true" aria-label="Trim margins"></button></label>
    <label class="rd-row rd-for-page rd-wide"><span>Two pages</span><button id="reader-spread" role="switch" aria-pressed="true" aria-label="Two pages"></button></label>
    <label class="rd-row rd-for-page rd-wide"><span>Fit width</span><button id="reader-fit" role="switch" aria-pressed="false" aria-label="Fit width"></button></label>
  </div>

  <div id="hl-pop" hidden role="toolbar" aria-label="Selection">
    <span class="hl-colors" aria-label="Highlight colour">
      <button class="sw" data-c="y" aria-label="Yellow"></button>
      <button class="sw" data-c="g" aria-label="Green"></button>
      <button class="sw" data-c="b" aria-label="Blue"></button>
      <button class="sw" data-c="p" aria-label="Pink"></button>
    </span>
    <button id="hl-add">Highlight</button>
    <button id="hl-add-note">Note</button>
  </div>

  <div id="hl-editor" hidden role="dialog" aria-label="Note">
    <blockquote id="hl-quote"></blockquote>
    <div class="hl-colors" id="hl-recolor" aria-label="Highlight colour">
      <button class="sw" data-c="y" aria-label="Yellow"></button>
      <button class="sw" data-c="g" aria-label="Green"></button>
      <button class="sw" data-c="b" aria-label="Blue"></button>
      <button class="sw" data-c="p" aria-label="Pink"></button>
    </div>
    <textarea id="hl-note" rows="4" placeholder="Add a note…" aria-label="Note"></textarea>
    <div class="hl-actions">
      <button id="hl-delete" class="link">Remove highlight</button>
      <button id="hl-done" class="btn primary">Done</button>
    </div>
  </div>

  <aside id="reader-panel" hidden data-tab="contents" aria-label="Contents and notes">
    <div class="rp-head">
      <div class="rp-tabs" role="tablist">
        <button data-tab="contents" role="tab" aria-selected="true">Contents</button>
        <button data-tab="notes" role="tab" aria-selected="false">Notes <span id="rp-count"></span></button>
      </div>
      <button id="rp-close" aria-label="Close panel">&times;</button>
    </div>
    <div id="rp-contents" class="rp-list"></div>
    <div class="rp-notes-wrap">
      <div id="rp-notes" class="rp-list"></div>
      <button id="rp-export" class="btn" hidden>Copy as Markdown</button>
    </div>
  </aside>
  <div class="rd-bar rd-bottom">
    <button id="reader-prev" aria-label="Previous page">&#8249;</button>
    <input id="reader-range" type="range" min="1" max="1" value="1" aria-label="Go to page">
    <button id="reader-next" aria-label="Next page">&#8250;</button>
    <span id="reader-count"></span>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="./config.js"></script>
<script src="./drive.js"></script>
<script src="./books.js"></script>
<script src="./about.js"></script>
<script src="./covers.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./notes.js"></script>
<script src="./shelf.js"></script>
<script src="./reader.js"></script>
</body>
</html>
