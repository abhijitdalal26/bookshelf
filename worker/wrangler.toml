# Cloudflare Worker that serves the books from R2 to the hosted shelf (see index.js).
# Deploy: cd worker && npx wrangler deploy
name = "bookshelf-files"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "bookshelf"

